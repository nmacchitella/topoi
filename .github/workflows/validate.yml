name: Validate

on:
  workflow_call:
  pull_request:
  push:
    branches: [development]

jobs:
  validate:
    name: Backend, frontend, and mobile smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify migrations and backend smoke tests
        working-directory: backend
        env:
          SECRET_KEY: topoi-ci-secret
          DATABASE_URL: sqlite:///${{ runner.temp }}/topoi-ci.db
        run: |
          alembic upgrade head
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and lint frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run deadcode

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
